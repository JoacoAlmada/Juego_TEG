<div class="container">
  <h1>Iniciar Sesión</h1>
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input
        type="text"
        id="usuario"
        name="usuario"
        [(ngModel)]="loginData.nombre"
        required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="loginData.contrasenia"
        required>
    </div>

    <button type="submit" class="btn" [disabled]="!loginForm.form.valid">
      Iniciar sesión
    </button>
  </form>

  <div class="toggle-text">
    ¿No tienes cuenta?
    <a routerLink="/register" class="link">Registrarse</a>
  </div>
</div>
