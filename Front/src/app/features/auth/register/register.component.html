<div class="container">
  <h1>Registrarse</h1>
  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input
        type="text"
        id="usuario"
        name="usuario"
        [(ngModel)]="registerData.usuario"
        required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="registerData.password"
        required>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar contraseña</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        [(ngModel)]="registerData.confirmPassword"
        required>
    </div>

    <button type="submit" class="btn" [disabled]="!registerForm.form.valid">
      Crear Cuenta
    </button>
  </form>

  <div class="toggle-text">
    ¿Ya tienes cuenta?
    <a routerLink="/login" class="link">Iniciar Sesión</a>
  </div>
</div>

<button class="back-btn" (click)="volverAtras()">Volver Atrás</button>
