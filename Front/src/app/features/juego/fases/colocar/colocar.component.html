<div class="control-panel">
  <div class="panel-header">
    <h2>FASE</h2>
    <h2>COLOCACION</h2>
  </div>

  <div class="player-info">
    <div class="player-turn" [ngClass]="colorJugador">
      <span class="value">{{ turnoJugador }}</span>
    </div>
  </div>

  <div class="mission-section">
    <button
      class="btn btn-mission"
      [class.active]="mostrarObjetivo"
      (click)="alternarObjetivo()">
      {{ mostrarObjetivo ? 'Ocultar Objetivo' : 'Mostrar Objetivo' }}
    </button>
    <div class="btn-indicator mission-indicator" [class.active]="mostrarObjetivo">
      Misión
    </div>
  </div>

  <div class="cards-section">
    <button class="btn btn-cards" (click)="abrirDialogoCartas()">Mostrar cartas</button>
    <dialog #dialogoCartas class="cartas-modal">
      <h2>CARTAS</h2>
      <div class="cards-container">
        <div *ngFor="let carta of cartas" class="card">
          <img [ngSrc]="carta.img" [alt]="carta.titulo" width="100" height="140">
          <span>{{ carta.titulo }}</span>
        </div>
        <button class="btn-canjear" (click)="canjear()">Canjear</button>
        <button class="btn-volver" (click)="cerrarDialogo()">Volver</button>
      </div>
    </dialog>
  </div>

  <div class="selector-section">
    <label for="neighbor-select">País</label>
    <select
      id="player-countries"
      [(ngModel)]="paisSeleccionado"
      class="form-select">
      <option *ngFor="let pais of paisesJugador" [ngValue]="pais">{{ pais.nombre }}</option>
    </select>
  </div>

  <div class="selector-section">
    <label for="army-quantity">Cantidad de ejército</label>
    <select
      id="army-quantity"
      [(ngModel)]="cantidadEjercitos"
      class="form-select">
      <option *ngFor="let cantidad of opcionesEjercitos" [value]="cantidad">{{ cantidad }}</option>
    </select>
  </div>

  <div class="action-section">
    <button
      class="btn btn-place"
      (click)="colocarEjercitos()"
      [disabled]="!paisSeleccionado || cantidadEjercitos > ejercitosDisponibles">
      Colocar
    </button>
  </div>

  <div class="game-info">
    <div class="info-item">
      <span class="label">Ejércitos disponibles:</span>
      <span class="value">{{ ejercitosDisponibles }}</span>
    </div>
    <div class="info-item" *ngIf="paisSeleccionado">
      <span class="label">País seleccionado:</span>
      <span class="value">{{ paisSeleccionado?.nombre }}</span>
    </div>
  </div>

  <div class="mission-panel" *ngIf="mostrarObjetivo && objetivoActual">
    <h3>Objetivo</h3>
    <div class="mission-item">
      <p>{{ objetivoActual.descripcion }}</p>
    </div>
  </div>

  <div class="cards-panel" *ngIf="mostrarCartas">
    <h3>Cartas</h3>
    <div class="cards-grid">
      <div class="card-item" *ngFor="let i of [1,2,3,4,5,6]">
        <div class="card-placeholder">Carta {{ i }}</div>
      </div>
    </div>
  </div>


  <div class="action-section action-section-bottom">
    <button
      class="btn btn-place"
      (click)="avanzarFase()"
      [disabled]="ejercitosDisponibles > 0">
      Avanzar
    </button>
  </div>
  <div *ngIf="isEjecutandoBot" class="bot-overlay">
    <div class="mensaje">Turno del bot. Espere...</div>
  </div>
</div>
